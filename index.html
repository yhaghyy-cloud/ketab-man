<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کتاب من</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7C2D28">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;700&family=Markazi+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1E7D0;
    --paper-2: #E9DBBB;
    --ink: #3B2A1D;
    --ink-soft: #6b5636;
    --leather: #7C2D28;
    --gold: #B08948;
    --night-bg: #221A12;
    --night-paper: #2C2114;
    --night-ink: #E7D9B8;
    --ui-font: 'Vazirmatn', 'Tahoma', sans-serif;
    --body-font: 'Amiri', 'Noto Naskh Arabic', serif;
    --title-font: 'Amiri', 'Noto Naskh Arabic', serif;
    --font-size: 20px;
    --line-height: 2.1;
    --text-align: right;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--night-bg);
    font-family:var(--ui-font);
    color:var(--ink);
  }
  #app{position:fixed; inset:0; overflow:hidden;}

  /* ---------- shared ---------- */
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  .screen.active{display:flex;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper); background:rgba(255,255,255,0.08);
    font-size:20px;
  }
  .icon-btn:active{background:rgba(255,255,255,0.18);}

  /* ---------- library screen ---------- */
  #library{background: linear-gradient(180deg, #1c150e, #241a10 60%, #1c150e);}
  .lib-header{
    padding:22px 20px 14px; display:flex; align-items:center; justify-content:space-between;
  }
  .lib-header h1{
    font-family:var(--title-font); color:var(--gold); font-size:32px; margin:0; font-weight:700;
    letter-spacing:0.5px; text-shadow:0 1px 0 rgba(0,0,0,0.35);
  }
  .lib-header .sub{color:#c7b48a; font-size:12.5px; margin-top:2px; font-family:var(--ui-font);}
  .lib-list{flex:1; overflow-y:auto; padding:8px 16px 100px;}
  .chapter-card{
    background: linear-gradient(135deg, #FBF3DD, #F1E3C4);
    border-radius:10px; padding:16px 18px; margin-bottom:12px;
    display:flex; align-items:center; gap:14px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(176,137,72,0.35);
    border-right:5px solid var(--leather);
  }
  .chapter-num{
    font-family:var(--title-font); font-size:28px; color:var(--leather); min-width:34px; text-align:center; font-weight:700;
  }
  .chapter-info{flex:1; min-width:0;}
  .chapter-info .t{font-family:var(--title-font); font-size:18px; color:var(--ink); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chapter-info .p{font-size:12.5px; color:var(--ink-soft); margin-top:3px; font-family:var(--ui-font);}
  .chapter-actions{display:flex; gap:6px;}
  .mini-btn{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:15px;}
  .mini-btn:active{background:rgba(0,0,0,0.08);}
  .empty-state{
    margin:60px 24px; text-align:center; color:#c7b48a; font-family:var(--ui-font);
  }
  .empty-state .big{font-size:44px; margin-bottom:10px;}
  .empty-state h3{font-family:var(--title-font); color:var(--gold); font-size:20px; margin:8px 0 6px;}
  .empty-state p{font-size:13.5px; line-height:1.8; opacity:0.85;}

  .fab-row{position:absolute; bottom:22px; left:0; right:0; display:flex; justify-content:center; gap:12px; padding:0 20px;}
  .fab{
    flex:1; max-width:220px; padding:14px 10px; border-radius:30px;
    font-family:var(--ui-font); font-weight:600; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .fab.primary{background: linear-gradient(135deg, var(--leather), #5f221e); color:#f5e9d3; box-shadow:0 4px 14px rgba(124,45,40,0.55);}
  .fab.secondary{background:rgba(255,255,255,0.08); color:var(--gold); border:1px solid rgba(176,137,72,0.4);}

  /* ---------- editor screen ---------- */
  #editor{background:var(--night-bg);}
  .editor-header{
    padding:16px 16px 12px; display:flex; align-items:center; gap:12px;
    border-bottom:1px solid rgba(176,137,72,0.25);
  }
  .editor-header h2{font-family:var(--title-font); color:var(--gold); font-size:19px; margin:0; flex:1;}
  .save-btn{
    background:var(--gold); color:#241a10; padding:9px 20px; border-radius:22px;
    font-weight:600; font-size:14px;
  }
  .editor-body{flex:1; overflow-y:auto; padding:18px 16px;}
  .field-label{color:#c7b48a; font-size:12.5px; margin:0 0 8px 2px; font-family:var(--ui-font);}
  #chapterTitleInput{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid rgba(176,137,72,0.4);
    background:#2C2114; color:var(--night-ink); font-size:17px; font-family:var(--title-font);
    margin-bottom:18px;
  }
  #chapterContentInput{
    width:100%; min-height:50vh; padding:14px; border-radius:10px; border:1px solid rgba(176,137,72,0.4);
    background:#FBF3DD; color:var(--ink); font-size:17px; font-family:var(--body-font); line-height:1.9;
    resize:vertical;
  }
  .hint{color:#8f7c58; font-size:12px; margin-top:10px; line-height:1.7; font-family:var(--ui-font);}

  /* ---------- reading screen ---------- */
  #reading{background:var(--paper);}
  #reading.theme-night{background:var(--night-bg);}
  #reading.theme-sepia{background:#E4D3A8;}

  .read-topbar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 10px; background:linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
    transition:opacity .25s, transform .25s;
  }
  .read-topbar .chap-title{color:var(--gold); font-family:var(--title-font); font-weight:700; font-size:17px; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 2px rgba(0,0,0,0.6);}
  .ui-hidden{opacity:0; pointer-events:none; transform:translateY(-8px);}

  .book-stage{flex:1; position:relative; overflow:hidden;}
  .page-layer{
    position:absolute; inset:10px 14px 46px;
    border-radius:6px;
    background:var(--paper-bg, var(--paper));
    box-shadow:0 6px 24px rgba(0,0,0,0.28);
    backface-visibility:hidden;
    transform-style:preserve-3d;
    padding:72px 22px 46px;
    overflow:hidden;
    transition:transform 0.55s cubic-bezier(.4,.1,.2,1);
  }
  .page-layer .page-text{
    font-family:var(--body-font); color:var(--text-col,var(--ink));
    font-size:var(--font-size); line-height:var(--line-height);
    white-space:pre-wrap; word-wrap:break-word;
    text-align:var(--text-align, right);
  }
  .page-num{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    font-family:var(--ui-font); font-size:11.5px; color:var(--ink-soft); opacity:0.7;
  }

  .tap-zone{position:absolute; z-index:15;}
  .book-stage[data-orientation="horizontal"] .tz-prev{top:0; bottom:0; right:0; width:32%;}
  .book-stage[data-orientation="horizontal"] .tz-next{top:0; bottom:0; left:0; width:32%;}
  .book-stage[data-orientation="vertical"] .tz-prev{left:0; right:0; top:0; height:26%;}
  .book-stage[data-orientation="vertical"] .tz-next{left:0; right:0; bottom:0; height:26%;}
  .tap-hint{
    position:absolute; color:rgba(59,42,29,0.28); font-size:22px; pointer-events:none;
  }
  .book-stage[data-orientation="horizontal"] .tz-prev .tap-hint{top:50%; right:8px; transform:translateY(-50%);}
  .book-stage[data-orientation="horizontal"] .tz-next .tap-hint{top:50%; left:8px; transform:translateY(-50%);}
  .book-stage[data-orientation="vertical"] .tz-prev .tap-hint{top:6px; left:50%; transform:translateX(-50%);}
  .book-stage[data-orientation="vertical"] .tz-next .tap-hint{bottom:6px; left:50%; transform:translateX(-50%);}

  .nav-btn{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:rgba(255,255,255,0.1); color:var(--gold); font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-btn:active{background:rgba(255,255,255,0.22);}
  .nav-btn:disabled{opacity:0.35;}

  .ribbon{
    position:absolute; top:0; z-index:18; width:28px; height:60px;
    right:38px;
    background:linear-gradient(180deg, var(--leather), #5c221e);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
    box-shadow:0 2px 6px rgba(0,0,0,0.4);
    display:flex; align-items:flex-start; justify-content:center; padding-top:8px;
  }
  .ribbon.active{background:linear-gradient(180deg, var(--gold), #8a6a34);}
  .ribbon span{color:#f5e9d3; font-size:13px;}

  .read-bottombar{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 16px 16px; background:linear-gradient(0deg, rgba(0,0,0,0.5), transparent);
    transition:opacity .25s, transform .25s;
  }
  .read-bottombar .pg-label{color:#F1E7D0; font-size:12.5px; font-family:var(--ui-font); flex:1; text-align:center;}

  /* ---------- settings sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40;
    display:none; align-items:flex-end;
  }
  .sheet-overlay.active{display:flex;}
  .sheet{
    width:100%; background:#2C2114; border-radius:20px 20px 0 0;
    padding:18px 20px 26px; max-height:80vh; overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,0.5);
  }
  .sheet h3{font-family:var(--title-font); color:var(--gold); font-size:19px; margin:0 0 16px; text-align:center;}
  .sheet-group{margin-bottom:20px;}
  .sheet-group label{display:block; color:#c7b48a; font-size:12.5px; margin-bottom:8px; font-family:var(--ui-font);}
  .opt-row{display:flex; gap:8px; flex-wrap:wrap;}
  .opt-chip{
    padding:9px 14px; border-radius:20px; border:1px solid rgba(176,137,72,0.4);
    color:var(--night-ink); font-size:13.5px; font-family:var(--ui-font);
  }
  .opt-chip.selected{background:var(--gold); color:#241a10; border-color:var(--gold); font-weight:600;}
  input[type=range]{width:100%; accent-color:var(--gold);}
  .theme-swatch{
    width:52px; height:36px; border-radius:8px; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:11px; font-family:var(--ui-font);
  }
  .theme-swatch.selected{border-color:var(--gold);}

  /* confirm dialog */
  .confirm-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50; display:none; align-items:center; justify-content:center;}
  .confirm-overlay.active{display:flex;}
  .confirm-box{background:#2C2114; border-radius:14px; padding:22px; width:80%; max-width:320px; text-align:center;}
  .confirm-box p{color:var(--night-ink); font-family:var(--ui-font); font-size:14.5px; margin:0 0 18px; line-height:1.8;}
  .confirm-buttons{display:flex; gap:10px;}
  .confirm-buttons button{flex:1; padding:11px; border-radius:10px; font-family:var(--ui-font); font-size:14px; font-weight:600;}
  .confirm-buttons .cancel{background:rgba(255,255,255,0.1); color:#e7d9b8;}
  .confirm-buttons .danger{background:var(--leather); color:#f5e9d3;}
</style>
</head>
<body>
<div id="app">

  <!-- BOOKSHELF -->
  <div class="screen active" id="bookshelf">
    <div class="lib-header">
      <div>
        <h1>قفسهٔ کتاب‌ها</h1>
        <div class="sub" id="bookCountLabel">۰ کتاب</div>
      </div>
    </div>
    <div class="lib-list" id="bookshelfList"></div>
    <div class="fab-row">
      <button class="fab primary" onclick="askNewBook()">＋ کتاب جدید</button>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="screen" id="library">
    <div class="lib-header">
      <div>
        <h1 id="libraryBookTitle">کتاب من</h1>
        <div class="sub" id="chapCountLabel">۰ فصل</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" onclick="backToBookshelf()">📚</button>
        <button class="icon-btn" onclick="openSettings()">⚙</button>
      </div>
    </div>
    <div class="lib-list" id="libList"></div>
    <div class="fab-row">
      <button class="fab secondary" onclick="openEditor(null)">＋ فصل جدید</button>
      <button class="fab primary" onclick="startReading()">📖 شروع مطالعه</button>
    </div>
  </div>

  <!-- EDITOR -->
  <div class="screen" id="editor">
    <div class="editor-header">
      <button class="icon-btn" onclick="closeEditor()">✕</button>
      <h2 id="editorHeading">فصل جدید</h2>
      <button class="save-btn" onclick="saveChapter()">ذخیره</button>
    </div>
    <div class="editor-body">
      <div class="field-label">عنوان فصل</div>
      <input id="chapterTitleInput" placeholder="مثلاً: فصل اول - آغاز" />
      <div class="field-label">متن</div>
      <textarea id="chapterContentInput" placeholder="اینجا بنویسید یا از جای دیگری کپی کرده و پیست کنید…"></textarea>
      <div class="hint">می‌توانید مستقیم تایپ کنید یا متن را از ورد یا هر جای دیگر کپی و در این‌جا پیست (Paste) کنید.</div>
    </div>
  </div>

  <!-- READING -->
  <div class="screen" id="reading">
    <div class="read-topbar" id="readTopbar">
      <button class="icon-btn" onclick="exitReading()">✕</button>
      <div class="chap-title" id="readChapTitle">—</div>
      <button class="icon-btn" onclick="openSettings()">⚙</button>
    </div>

    <div class="book-stage" id="bookStage" data-orientation="horizontal">
      <div class="page-layer" id="pageBehind"><div class="page-text" id="pageTextBehind"></div><div class="page-num" id="pageNumBehind"></div></div>
      <div class="page-layer" id="pageFront"><div class="page-text" id="pageTextFront"></div><div class="page-num" id="pageNumFront"></div></div>
      <div class="ribbon" id="ribbonBtn" onclick="toggleBookmark()"><span>🔖</span></div>
      <div class="tap-zone tz-prev" id="tzPrev" onclick="tapRightZone()"><div class="tap-hint" id="prevHint">‹</div></div>
      <div class="tap-zone tz-next" id="tzNext" onclick="tapLeftZone()"><div class="tap-hint" id="nextHint">›</div></div>
    </div>

    <div class="read-bottombar" id="readBottombar">
      <button class="icon-btn" onclick="showChapterList()">☰</button>
      <button class="nav-btn" id="navPrevBtn" onclick="prevPage()">‹</button>
      <div class="pg-label" id="pgLabel">صفحه ۱ از ۱</div>
      <button class="nav-btn" id="navNextBtn" onclick="nextPage()">›</button>
    </div>
  </div>

</div>

<!-- SETTINGS SHEET -->
<div class="sheet-overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
  <div class="sheet">
    <h3>تنظیمات نمایش</h3>

    <div class="sheet-group">
      <label>تم رنگی</label>
      <div class="opt-row">
        <button class="theme-swatch" data-theme="cream" style="background:#F1E7D0; color:#3B2A1D;" onclick="setTheme('cream')">کرم</button>
        <button class="theme-swatch" data-theme="sepia" style="background:#E4D3A8; color:#3B2A1D;" onclick="setTheme('sepia')">سپیا</button>
        <button class="theme-swatch" data-theme="night" style="background:#2C2114; color:#E7D9B8;" onclick="setTheme('night')">شب</button>
      </div>
    </div>

    <div class="sheet-group">
      <label>فونت متن</label>
      <div class="opt-row" id="fontOptRow">
        <button class="opt-chip" data-font="Amiri" onclick="setFont('Amiri')" style="font-family:Amiri,serif;">سنتی (امیری)</button>
        <button class="opt-chip" data-font="NotoNaskh" onclick="setFont('NotoNaskh')" style="font-family:'Noto Naskh Arabic',serif;">نسخ کلاسیک</button>
        <button class="opt-chip" data-font="Markazi" onclick="setFont('Markazi')" style="font-family:'Markazi Text',serif;">مرکزی</button>
        <button class="opt-chip" data-font="Vazirmatn" onclick="setFont('Vazirmatn')" style="font-family:Vazirmatn,sans-serif;">مدرن (وزیرمتن)</button>
      </div>
    </div>

    <div class="sheet-group">
      <label>جهت ورق زدن</label>
      <div class="opt-row" id="orientationOptRow">
        <button class="opt-chip" data-orientation="horizontal" onclick="setOrientation('horizontal')">افقی (چپ/راست)</button>
        <button class="opt-chip" data-orientation="vertical" onclick="setOrientation('vertical')">عمودی (بالا/پایین)</button>
      </div>
    </div>

    <div class="sheet-group">
      <label>جهت خواندن (برای حالت افقی)</label>
      <div class="opt-row" id="pageDirOptRow">
        <button class="opt-chip" data-pagedir="rtl" onclick="setPageDirection('rtl')">راست به چپ (فارسی)</button>
        <button class="opt-chip" data-pagedir="ltr" onclick="setPageDirection('ltr')">چپ به راست (لاتین)</button>
      </div>
    </div>

    <div class="sheet-group">
      <label>چینش متن</label>
      <div class="opt-row" id="alignOptRow">
        <button class="opt-chip" data-align="right" onclick="setAlign('right')">راست‌چین</button>
        <button class="opt-chip" data-align="center" onclick="setAlign('center')">وسط‌چین</button>
        <button class="opt-chip" data-align="left" onclick="setAlign('left')">چپ‌چین</button>
      </div>
    </div>

    <div class="sheet-group">
      <label>اندازه قلم: <span id="fontSizeLabel">۲۰</span></label>
      <input type="range" id="fontSizeRange" min="14" max="36" step="1" oninput="setFontSize(this.value)">
    </div>

    <div class="sheet-group">
      <label>فاصله خطوط</label>
      <input type="range" id="lineHeightRange" min="150" max="260" step="10" oninput="setLineHeight(this.value)">
    </div>

    <div class="sheet-group">
      <label>قفل ویرایش (رمز عبور)</label>
      <div id="pwManageArea"></div>
    </div>

    <div class="sheet-group">
      <button class="fab secondary" style="width:100%;" onclick="closeSettings()">بستن</button>
    </div>
  </div>
</div>

<!-- CHAPTER JUMP SHEET -->
<div class="sheet-overlay" id="chapterListOverlay" onclick="if(event.target===this) closeChapterList()">
  <div class="sheet">
    <h3>فهرست فصل‌ها</h3>
    <div id="jumpList"></div>
  </div>
</div>

<!-- PASSWORD PROMPT OVERLAY -->
<div class="confirm-overlay" id="passwordOverlay">
  <div class="confirm-box">
    <p style="margin-bottom:10px;">برای ورود، رمز عبور را وارد کنید</p>
    <input id="pwInput" type="password" placeholder="رمز عبور" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(176,137,72,0.4);background:#221A12;color:var(--night-ink);font-size:15px;margin-bottom:8px;text-align:center;">
    <p id="pwError" style="display:none;color:#e77;font-size:12.5px;margin:0 0 12px;">رمز اشتباه است</p>
    <div class="confirm-buttons">
      <button class="cancel" onclick="cancelPasswordPrompt()">انصراف</button>
      <button class="danger" onclick="submitPassword()">ورود</button>
    </div>
  </div>
</div>

<!-- BOOK NAME OVERLAY -->
<div class="confirm-overlay" id="bookNameOverlay">
  <div class="confirm-box">
    <p id="bookNamePrompt" style="margin-bottom:10px;">نام کتاب را وارد کنید</p>
    <input id="bookNameInput" type="text" placeholder="مثلاً: خاطرات من" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(176,137,72,0.4);background:#221A12;color:var(--night-ink);font-size:15px;margin-bottom:8px;box-sizing:border-box;">
    <div class="confirm-buttons">
      <button class="cancel" onclick="closeBookNameOverlay()">انصراف</button>
      <button class="danger" style="background:var(--gold); color:#241a10;" onclick="submitBookName()">تأیید</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmText">مطمئن هستید؟</p>
    <div class="confirm-buttons">
      <button class="cancel" onclick="closeConfirm()">انصراف</button>
      <button class="danger" id="confirmDangerBtn">حذف</button>
    </div>
  </div>
</div>


<script>
/* ---------------- Data layer (multi-book) ---------------- */
const LEGACY_STORAGE_KEY = 'ketabman_data_v1';
const SETTINGS_KEY = 'ketabman_settings_v1';
const BOOKS_INDEX_KEY = 'ketabman_books_index_v1';
function bookKey(id){ return 'ketabman_book_' + id; }

function defaultSettings(){
  return {theme:'cream', font:'Amiri', fontSize:20, lineHeight:210, orientation:'horizontal', pageDirection:'rtl', align:'right', editPassword:null};
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) return Object.assign(defaultSettings(), JSON.parse(raw));
  }catch(e){}
  return defaultSettings();
}
function persistSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); }catch(e){}
}

function loadBookData(id){
  try{
    const raw = localStorage.getItem(bookKey(id));
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { chapters: [], bookmark: null };
}
function persistBooksIndex(){
  try{ localStorage.setItem(BOOKS_INDEX_KEY, JSON.stringify(BOOKS_INDEX)); }catch(e){}
}

// One-time migration: if this phone still has data from the old single-book
// version, wrap it into the new multi-book format as the first book so
// nothing already written is lost.
function migrateIfNeeded(){
  let idxRaw = null;
  try{ idxRaw = localStorage.getItem(BOOKS_INDEX_KEY); }catch(e){}
  if(idxRaw){ try{ BOOKS_INDEX = JSON.parse(idxRaw); }catch(e){ BOOKS_INDEX = []; } return; }

  let legacy = null;
  try{
    const raw = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(raw) legacy = JSON.parse(raw);
  }catch(e){}

  if(legacy){
    const id = uid();
    const bookData = { chapters: legacy.chapters || [], bookmark: legacy.bookmark || null };
    try{ localStorage.setItem(bookKey(id), JSON.stringify(bookData)); }catch(e){}
    BOOKS_INDEX = [{ id, title: 'کتاب من', createdAt: Date.now(), lastOpened: Date.now() }];
    if(legacy.settings){
      SETTINGS = Object.assign(defaultSettings(), legacy.settings);
      persistSettings();
    }
  } else {
    BOOKS_INDEX = [];
  }
  persistBooksIndex();
}

let SETTINGS = loadSettings();
let BOOKS_INDEX = [];
let currentBookId = null;
let CURRENT_BOOK = { chapters: [], bookmark: null };

function persist(){
  if(!currentBookId) return;
  try{ localStorage.setItem(bookKey(currentBookId), JSON.stringify(CURRENT_BOOK)); }catch(e){}
}

function uid(){ return 'c'+Date.now()+Math.floor(Math.random()*1000); }

/* ---------------- Screen switching ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- Bookshelf ---------------- */
function renderBookshelf(){
  document.getElementById('bookCountLabel').textContent = toFa(BOOKS_INDEX.length) + ' کتاب';
  const list = document.getElementById('bookshelfList');
  if(BOOKS_INDEX.length===0){
    list.innerHTML = `<div class="empty-state">
      <div class="big">📚</div>
      <h3>هنوز کتابی نساخته‌ای</h3>
      <p>با دکمهٔ «کتاب جدید» اولین کتابت را بساز؛<br>هر کتاب فصل‌ها و نام جداگانهٔ خودش را دارد.</p>
    </div>`;
    return;
  }
  const sorted = [...BOOKS_INDEX].sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0));
  list.innerHTML = sorted.map(b=>{
    const data = loadBookData(b.id);
    const chapCount = (data.chapters||[]).length;
    return `
    <div class="chapter-card" onclick="openBook('${b.id}')" style="cursor:pointer;">
      <div class="chapter-num">📖</div>
      <div class="chapter-info">
        <div class="t">${escapeHtml(b.title)}</div>
        <div class="p">${toFa(chapCount)} فصل</div>
      </div>
      <div class="chapter-actions">
        <button class="mini-btn" onclick="event.stopPropagation(); askRenameBook('${b.id}')">✎</button>
        <button class="mini-btn" onclick="event.stopPropagation(); askDeleteBook('${b.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function openBook(id){
  const entry = BOOKS_INDEX.find(b=>b.id===id);
  if(!entry) return;
  currentBookId = id;
  CURRENT_BOOK = loadBookData(id);
  entry.lastOpened = Date.now();
  persistBooksIndex();
  document.getElementById('libraryBookTitle').textContent = entry.title;
  showScreen('library');
  renderLibrary();
}
function backToBookshelf(){
  showScreen('bookshelf');
  renderBookshelf();
}

let bookNameMode = null; // 'new' | 'rename'
let bookNameTargetId = null;
function askNewBook(){
  requireUnlock(()=>{
    bookNameMode = 'new'; bookNameTargetId = null;
    document.getElementById('bookNamePrompt').textContent = 'نام کتاب جدید را وارد کنید';
    document.getElementById('bookNameInput').value = '';
    document.getElementById('bookNameOverlay').classList.add('active');
    setTimeout(()=>{ const el=document.getElementById('bookNameInput'); if(el) el.focus(); }, 50);
  });
}
function askRenameBook(id){
  requireUnlock(()=>{
    const entry = BOOKS_INDEX.find(b=>b.id===id);
    if(!entry) return;
    bookNameMode = 'rename'; bookNameTargetId = id;
    document.getElementById('bookNamePrompt').textContent = 'نام جدید کتاب را وارد کنید';
    document.getElementById('bookNameInput').value = entry.title;
    document.getElementById('bookNameOverlay').classList.add('active');
    setTimeout(()=>{ const el=document.getElementById('bookNameInput'); if(el) el.focus(); }, 50);
  });
}
function closeBookNameOverlay(){
  document.getElementById('bookNameOverlay').classList.remove('active');
  bookNameMode = null; bookNameTargetId = null;
}
function submitBookName(){
  const val = (document.getElementById('bookNameInput').value||'').trim();
  if(!val) return;
  if(bookNameMode==='new'){
    const id = uid();
    const bookData = { chapters: [], bookmark: null };
    try{ localStorage.setItem(bookKey(id), JSON.stringify(bookData)); }catch(e){}
    BOOKS_INDEX.push({ id, title: val, createdAt: Date.now(), lastOpened: Date.now() });
    persistBooksIndex();
    closeBookNameOverlay();
    openBook(id);
  } else if(bookNameMode==='rename'){
    const entry = BOOKS_INDEX.find(b=>b.id===bookNameTargetId);
    if(entry){ entry.title = val; persistBooksIndex(); }
    closeBookNameOverlay();
    renderBookshelf();
    if(currentBookId===bookNameTargetId){
      document.getElementById('libraryBookTitle').textContent = val;
    }
  }
}

let deleteBookTargetId = null;
function askDeleteBook(id){
  requireUnlock(()=>{
    deleteBookTargetId = id;
    document.getElementById('confirmText').textContent = 'این کتاب و همهٔ فصل‌های آن برای همیشه حذف می‌شود. مطمئنی؟';
    const btn = document.getElementById('confirmDangerBtn');
    btn.textContent = 'حذف کن';
    btn.onclick = ()=>{
      try{ localStorage.removeItem(bookKey(deleteBookTargetId)); }catch(e){}
      BOOKS_INDEX = BOOKS_INDEX.filter(b=>b.id!==deleteBookTargetId);
      persistBooksIndex();
      closeConfirm();
      renderBookshelf();
    };
    document.getElementById('confirmOverlay').classList.add('active');
  });
}

/* ---------------- Library (chapters of the currently open book) ---------------- */
function renderLibrary(){
  const list = document.getElementById('libList');
  document.getElementById('chapCountLabel').textContent = toFa(CURRENT_BOOK.chapters.length) + ' فصل';
  if(CURRENT_BOOK.chapters.length===0){
    list.innerHTML = `<div class="empty-state">
      <div class="big">📕</div>
      <h3>هنوز فصلی نداری</h3>
      <p>با دکمهٔ «فصل جدید» اولین نوشته‌ات را اضافه کن،<br>بعد از دکمهٔ «شروع مطالعه» آن را مثل یک کتاب واقعی بخوان.</p>
    </div>`;
    return;
  }
  list.innerHTML = CURRENT_BOOK.chapters.map((ch,i)=>`
    <div class="chapter-card">
      <div class="chapter-num">${toFa(i+1)}</div>
      <div class="chapter-info">
        <div class="t">${escapeHtml(ch.title||'بدون عنوان')}</div>
        <div class="p">${(ch.content||'').replace(/\s+/g,' ').slice(0,40) || 'خالی'}${(ch.content||'').length>40?'…':''}</div>
      </div>
      <div class="chapter-actions">
        <button class="mini-btn" onclick="moveChapter(${i},-1)">▲</button>
        <button class="mini-btn" onclick="moveChapter(${i},1)">▼</button>
        <button class="mini-btn" onclick="openEditor('${ch.id}')">✎</button>
        <button class="mini-btn" onclick="askDeleteChapter('${ch.id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

function toFa(n){
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).split('').map(d=> fa[d] !== undefined ? fa[d] : d).join('');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function moveChapter(index, dir){
  const newIndex = index+dir;
  if(newIndex<0 || newIndex>=CURRENT_BOOK.chapters.length) return;
  const tmp = CURRENT_BOOK.chapters[index];
  CURRENT_BOOK.chapters[index] = CURRENT_BOOK.chapters[newIndex];
  CURRENT_BOOK.chapters[newIndex] = tmp;
  persist();
  renderLibrary();
}

let deleteTargetId = null;
function askDeleteChapter(id){
  deleteTargetId = id;
  document.getElementById('confirmText').textContent = 'این فصل برای همیشه حذف می‌شود. مطمئنی؟';
  const btn = document.getElementById('confirmDangerBtn');
  btn.textContent = 'حذف کن';
  btn.onclick = ()=>{
    CURRENT_BOOK.chapters = CURRENT_BOOK.chapters.filter(c=>c.id!==deleteTargetId);
    persist(); renderLibrary(); closeConfirm();
  };
  document.getElementById('confirmOverlay').classList.add('active');
}
function closeConfirm(){ document.getElementById('confirmOverlay').classList.remove('active'); }

/* ---------------- Editor ---------------- */
let editingId = null;
function openEditor(id){
  requireUnlock(()=>{ doOpenEditor(id); });
}
function doOpenEditor(id){
  editingId = id;
  const ch = id ? CURRENT_BOOK.chapters.find(c=>c.id===id) : null;
  document.getElementById('editorHeading').textContent = id ? 'ویرایش فصل' : 'فصل جدید';
  document.getElementById('chapterTitleInput').value = ch ? ch.title : '';
  document.getElementById('chapterContentInput').value = ch ? ch.content : '';
  showScreen('editor');
}
function closeEditor(){ showScreen('library'); }
function saveChapter(){
  const title = document.getElementById('chapterTitleInput').value.trim() || 'بدون عنوان';
  const content = document.getElementById('chapterContentInput').value;
  if(editingId){
    const ch = CURRENT_BOOK.chapters.find(c=>c.id===editingId);
    ch.title = title; ch.content = content;
  } else {
    CURRENT_BOOK.chapters.push({id: uid(), title, content});
  }
  persist();
  renderLibrary();
  showScreen('library');
}

/* ---------------- Reading / pagination ---------------- */
let pages = []; // { chapterIndex, chapterTitle, text, pageInChapter, totalInChapter }
let currentPageIndex = 0;
let readingTheme = SETTINGS.theme;

function applySettingsToRoot(){
  document.documentElement.style.setProperty('--font-size', SETTINGS.fontSize+'px');
  document.documentElement.style.setProperty('--line-height', (SETTINGS.lineHeight/100));
  document.documentElement.style.setProperty('--body-font', fontStackFor(SETTINGS.font));
  document.documentElement.style.setProperty('--text-align', SETTINGS.align || 'right');
}
function fontStackFor(key){
  if(key==='Amiri') return "'Amiri','Noto Naskh Arabic',serif";
  if(key==='NotoNaskh') return "'Noto Naskh Arabic','Amiri',serif";
  if(key==='Markazi') return "'Markazi Text','Amiri',serif";
  return "'Vazirmatn','Tahoma',sans-serif";
}

function themeColors(theme){
  if(theme==='night') return {bg:'#2C2114', text:'#E7D9B8'};
  if(theme==='sepia') return {bg:'#E4D3A8', text:'#3B2A1D'};
  return {bg:'#F1E7D0', text:'#3B2A1D'};
}

function paginateAll(){
  applySettingsToRoot();
  pages = [];
  if(CURRENT_BOOK.chapters.length===0) return;

  // Measure the REAL page-layer element's content box (padding-aware),
  // rather than guessing offsets, so pagination matches what's actually visible.
  const pageEl = document.getElementById('pageFront');
  const pageRect = pageEl.getBoundingClientRect();
  const cs = getComputedStyle(pageEl);
  const padLeft = parseFloat(cs.paddingLeft) || 0;
  const padRight = parseFloat(cs.paddingRight) || 0;
  const padTop = parseFloat(cs.paddingTop) || 0;
  const padBottom = parseFloat(cs.paddingBottom) || 0;
  const pageWidth = Math.max(50, pageRect.width - padLeft - padRight);
  // reserve extra room at the bottom for the page-number label so text never collides with it
  const pageHeight = Math.max(50, (pageRect.height - padTop - padBottom - 10) * 0.97);

  const measurer = document.createElement('div');
  measurer.style.position='absolute';
  measurer.style.visibility='hidden';
  measurer.style.left = '-9999px';
  measurer.style.top = '0';
  measurer.style.width = pageWidth+'px';
  measurer.style.fontFamily = fontStackFor(SETTINGS.font);
  measurer.style.fontSize = SETTINGS.fontSize+'px';
  measurer.style.lineHeight = (SETTINGS.lineHeight/100);
  measurer.style.whiteSpace = 'pre-wrap';
  measurer.style.wordWrap = 'break-word';
  document.body.appendChild(measurer);

  CURRENT_BOOK.chapters.forEach((ch, chapterIndex)=>{
    const words = (ch.content||'').split(/(\s+)/); // keep whitespace tokens incl newlines
    let current = '';
    let chapterPages = [];
    for(let i=0;i<words.length;i++){
      const attempt = current + words[i];
      measurer.textContent = attempt;
      if(measurer.offsetHeight > pageHeight && current.length>0){
        chapterPages.push(current);
        current = words[i].replace(/^\s+/,'');
      } else {
        current = attempt;
      }
    }
    if(current.trim().length>0 || chapterPages.length===0) chapterPages.push(current);

    chapterPages.forEach((text, idx)=>{
      pages.push({
        chapterIndex,
        chapterTitle: ch.title,
        text,
        pageInChapter: idx+1,
        totalInChapter: chapterPages.length
      });
    });
  });

  document.body.removeChild(measurer);
}

function startReading(){
  if(CURRENT_BOOK.chapters.length===0){
    openEditor(null);
    return;
  }
  showScreen('reading');
  const stage = document.getElementById('bookStage');
  if(stage) stage.setAttribute('data-orientation', SETTINGS.orientation || 'horizontal');
  const doPaginate = ()=>{
    setTimeout(()=>{
      paginateAll();
      if(CURRENT_BOOK.bookmark && CURRENT_BOOK.bookmark.pageIndex < pages.length){
        currentPageIndex = CURRENT_BOOK.bookmark.pageIndex;
      } else {
        currentPageIndex = 0;
      }
      setTheme(SETTINGS.theme, true);
      renderCurrentPage();
    }, 60);
  };
  if(document.fonts && document.fonts.ready){
    const fontsPromise = document.fonts.ready.catch(()=>{});
    const timeoutPromise = new Promise(resolve=>setTimeout(resolve, 1200));
    Promise.race([fontsPromise, timeoutPromise]).then(doPaginate);
  } else {
    doPaginate();
  }
}

function exitReading(){
  showScreen('library');
  renderLibrary();
}

function renderCurrentPage(){
  if(pages.length===0){ pages=[{chapterTitle:'—', text:'این فصل خالی است.', pageInChapter:1, totalInChapter:1}]; }
  const p = pages[currentPageIndex];
  document.getElementById('readChapTitle').textContent = p.chapterTitle;
  document.getElementById('pageTextFront').textContent = p.text;
  document.getElementById('pageNumFront').textContent = `${toFa(p.pageInChapter)} از ${toFa(p.totalInChapter)}`;
  document.getElementById('pgLabel').textContent = `صفحه ${toFa(currentPageIndex+1)} از ${toFa(pages.length)}`;
  updateRibbon();
  const prevBtn = document.getElementById('navPrevBtn');
  const nextBtn = document.getElementById('navNextBtn');
  if(prevBtn) prevBtn.disabled = currentPageIndex<=0;
  if(nextBtn) nextBtn.disabled = currentPageIndex>=pages.length-1;
}

function preloadBehind(p){
  if(!p) { document.getElementById('pageTextBehind').textContent=''; return; }
  document.getElementById('pageTextBehind').textContent = p.text;
  document.getElementById('pageNumBehind').textContent = `${toFa(p.pageInChapter)} از ${toFa(p.totalInChapter)}`;
}

let flipping = false;
function flipTo(direction){
  if(flipping) return;
  if(direction==='next' && currentPageIndex >= pages.length-1){ pulseEdge(); return; }
  if(direction==='prev' && currentPageIndex <= 0){ pulseEdge(); return; }

  flipping = true;
  const front = document.getElementById('pageFront');
  const orientation = SETTINGS.orientation || 'horizontal';
  const targetIndex = direction==='next' ? currentPageIndex+1 : currentPageIndex-1;
  preloadBehind(pages[targetIndex]);

  let origin, angle;
  const isRTL = (SETTINGS.pageDirection || 'rtl') === 'rtl';
  if(orientation==='vertical'){
    origin = direction==='next' ? 'center bottom' : 'center top';
    angle = direction==='next' ? 'rotateX(-158deg)' : 'rotateX(158deg)';
  } else if(isRTL){
    origin = direction==='next' ? 'right center' : 'left center';
    angle = direction==='next' ? 'rotateY(-158deg)' : 'rotateY(158deg)';
  } else {
    origin = direction==='next' ? 'left center' : 'right center';
    angle = direction==='next' ? 'rotateY(158deg)' : 'rotateY(-158deg)';
  }

  front.style.transformOrigin = origin;
  front.style.transform = 'none';
  // force reflow so the browser registers the starting state before animating
  void front.offsetHeight;
  front.style.transform = angle;

  setTimeout(()=>{
    currentPageIndex = targetIndex;
    front.style.transition = 'none';
    front.style.transform = 'none';
    renderCurrentPage();
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ front.style.transition=''; flipping=false; });
    });
  }, 560);
}
function nextPage(){ flipTo('next'); }
function prevPage(){ flipTo('prev'); }
function tapRightZone(){ ((SETTINGS.pageDirection||'rtl')==='ltr') ? nextPage() : prevPage(); }
function tapLeftZone(){ ((SETTINGS.pageDirection||'rtl')==='ltr') ? prevPage() : nextPage(); }

function pulseEdge(){
  const stage = document.getElementById('bookStage');
  stage.style.transition='transform .1s';
  stage.style.transform='scale(0.985)';
  setTimeout(()=>{ stage.style.transform='scale(1)'; }, 100);
}

/* toggle UI chrome on tap in the middle (not the side/edge zones) */
document.getElementById('bookStage').addEventListener('click', (e)=>{
  const rect = e.currentTarget.getBoundingClientRect();
  const orientation = SETTINGS.orientation || 'horizontal';
  if(orientation==='vertical'){
    const relY = (e.clientY - rect.top) / rect.height;
    if(relY > 0.30 && relY < 0.70){
      document.getElementById('readTopbar').classList.toggle('ui-hidden');
      document.getElementById('readBottombar').classList.toggle('ui-hidden');
    }
  } else {
    const relX = (e.clientX - rect.left) / rect.width;
    if(relX > 0.34 && relX < 0.66){
      document.getElementById('readTopbar').classList.toggle('ui-hidden');
      document.getElementById('readBottombar').classList.toggle('ui-hidden');
    }
  }
});

/* swipe gesture support, as a robust backup to the tap zones */
(function(){
  let startX=0, startY=0, startT=0, tracking=false;
  const stage = document.getElementById('bookStage');
  stage.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startT = Date.now();
    tracking = true;
  }, {passive:true});
  stage.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    const dt = Date.now() - startT;
    if(dt > 700) return;
    const orientation = SETTINGS.orientation || 'horizontal';
    const THRESH = 40;
    if(orientation==='vertical'){
      if(Math.abs(dy) > THRESH && Math.abs(dy) > Math.abs(dx)){
        if(dy < 0) nextPage(); else prevPage();
      }
    } else {
      if(Math.abs(dx) > THRESH && Math.abs(dx) > Math.abs(dy)){
        if(dx < 0) tapLeftZone(); else tapRightZone();
      }
    }
  }, {passive:true});
})();

/* ---------------- bookmark ---------------- */
function updateRibbon(){
  const isBookmarked = CURRENT_BOOK.bookmark && CURRENT_BOOK.bookmark.pageIndex === currentPageIndex;
  document.getElementById('ribbonBtn').classList.toggle('active', !!isBookmarked);
}
function toggleBookmark(){
  if(CURRENT_BOOK.bookmark && CURRENT_BOOK.bookmark.pageIndex === currentPageIndex){
    CURRENT_BOOK.bookmark = null;
  } else {
    CURRENT_BOOK.bookmark = { pageIndex: currentPageIndex };
  }
  persist();
  updateRibbon();
}

/* ---------------- chapter jump list ---------------- */
function showChapterList(){
  const jump = document.getElementById('jumpList');
  jump.innerHTML = CURRENT_BOOK.chapters.map((ch,i)=>{
    const firstPageIdx = pages.findIndex(p=>p.chapterIndex===i);
    return `<div class="chapter-card" style="border-right-color:var(--gold);" onclick="jumpToChapter(${firstPageIdx})">
      <div class="chapter-num">${toFa(i+1)}</div>
      <div class="chapter-info"><div class="t">${escapeHtml(ch.title)}</div></div>
    </div>`;
  }).join('') || '<p style="color:#c7b48a;text-align:center;">فصلی وجود ندارد</p>';
  document.getElementById('chapterListOverlay').classList.add('active');
}
function closeChapterList(){ document.getElementById('chapterListOverlay').classList.remove('active'); }
function jumpToChapter(pageIdx){
  if(pageIdx<0) return;
  currentPageIndex = pageIdx;
  renderCurrentPage();
  closeChapterList();
}

/* ---------------- settings ---------------- */
function openSettings(){
  requireUnlock(()=>{ doOpenSettings(); });
}
function doOpenSettings(){
  document.getElementById('fontSizeRange').value = SETTINGS.fontSize;
  document.getElementById('fontSizeLabel').textContent = toFa(SETTINGS.fontSize);
  document.getElementById('lineHeightRange').value = SETTINGS.lineHeight;
  refreshSettingsUI();
  renderPwManageArea();
  document.getElementById('settingsOverlay').classList.add('active');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('active');
  const readingActive = document.getElementById('reading').classList.contains('active');
  if(readingActive){ paginateAll(); if(currentPageIndex>=pages.length) currentPageIndex=pages.length-1; renderCurrentPage(); }
}
function refreshSettingsUI(){
  document.querySelectorAll('.theme-swatch').forEach(b=> b.classList.toggle('selected', b.dataset.theme===SETTINGS.theme));
  document.querySelectorAll('#fontOptRow .opt-chip').forEach(b=> b.classList.toggle('selected', b.dataset.font===SETTINGS.font));
  document.querySelectorAll('#orientationOptRow .opt-chip').forEach(b=> b.classList.toggle('selected', b.dataset.orientation===(SETTINGS.orientation||'horizontal')));
  document.querySelectorAll('#pageDirOptRow .opt-chip').forEach(b=> b.classList.toggle('selected', b.dataset.pagedir===(SETTINGS.pageDirection||'rtl')));
  document.querySelectorAll('#alignOptRow .opt-chip').forEach(b=> b.classList.toggle('selected', b.dataset.align===(SETTINGS.align||'right')));
}
function setAlign(a){
  SETTINGS.align = a;
  persistSettings();
  document.documentElement.style.setProperty('--text-align', a);
  refreshSettingsUI();
}
function setPageDirection(d){
  SETTINGS.pageDirection = d;
  persistSettings();
  refreshSettingsUI();
}

/* ---------------- edit lock (password) ---------------- */
let unlockedForSession = false;
let pendingUnlockCallback = null;
function requireUnlock(cb){
  if(!SETTINGS.editPassword || unlockedForSession){ cb(); return; }
  pendingUnlockCallback = cb;
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('passwordOverlay').classList.add('active');
  setTimeout(()=>{ const el=document.getElementById('pwInput'); if(el) el.focus(); }, 50);
}
function submitPassword(){
  const val = document.getElementById('pwInput').value;
  if(val === SETTINGS.editPassword){
    unlockedForSession = true;
    document.getElementById('passwordOverlay').classList.remove('active');
    const cb = pendingUnlockCallback;
    pendingUnlockCallback = null;
    if(cb) cb();
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
}
function cancelPasswordPrompt(){
  document.getElementById('passwordOverlay').classList.remove('active');
  pendingUnlockCallback = null;
}
function renderPwManageArea(){
  const area = document.getElementById('pwManageArea');
  if(!area) return;
  if(SETTINGS.editPassword){
    area.innerHTML = `
      <div style="color:#c7b48a;font-size:12.5px;margin-bottom:8px;">قفل فعال است. برای باز کردن تنظیمات و ویرایش فصل‌ها، رمز لازم است.</div>
      <div class="opt-row">
        <button class="opt-chip" onclick="promptChangePassword()">تغییر رمز</button>
        <button class="opt-chip" onclick="clearEditPassword()">حذف قفل</button>
      </div>`;
  } else {
    area.innerHTML = `
      <div style="color:#c7b48a;font-size:12.5px;margin-bottom:8px;">قفل غیرفعال است. با تنظیم رمز، ورود به تنظیمات و ویرایش فصل‌ها نیاز به رمز خواهد داشت.</div>
      <input id="newPwField" type="password" placeholder="یک رمز عبور وارد کنید" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(176,137,72,0.4);background:#221A12;color:var(--night-ink);font-size:15px;margin-bottom:8px;box-sizing:border-box;">
      <button class="fab secondary" style="width:100%;" onclick="setNewPassword()">فعال‌سازی قفل</button>`;
  }
}
function setNewPassword(){
  const field = document.getElementById('newPwField');
  const v = field ? field.value : '';
  if(!v){ return; }
  SETTINGS.editPassword = v;
  unlockedForSession = true;
  persistSettings();
  renderPwManageArea();
}
function promptChangePassword(){
  SETTINGS.editPassword = null;
  persistSettings();
  renderPwManageArea();
}
function clearEditPassword(){
  SETTINGS.editPassword = null;
  unlockedForSession = true;
  persistSettings();
  renderPwManageArea();
}
function setOrientation(o){
  SETTINGS.orientation = o;
  persistSettings();
  const stage = document.getElementById('bookStage');
  if(stage) stage.setAttribute('data-orientation', o);
  refreshSettingsUI();
  const readingActive = document.getElementById('reading').classList.contains('active');
  if(readingActive){
    paginateAll();
    if(currentPageIndex>=pages.length) currentPageIndex = Math.max(0,pages.length-1);
    renderCurrentPage();
  }
}
function setTheme(theme, skipRepaginate){
  SETTINGS.theme = theme;
  persistSettings();
  const colors = themeColors(theme);
  const reading = document.getElementById('reading');
  reading.classList.remove('theme-night','theme-sepia');
  if(theme==='night') reading.classList.add('theme-night');
  if(theme==='sepia') reading.classList.add('theme-sepia');
  document.documentElement.style.setProperty('--paper-bg', colors.bg);
  document.documentElement.style.setProperty('--text-col', colors.text);
  document.getElementById('pageFront').style.background = colors.bg;
  document.getElementById('pageBehind').style.background = colors.bg;
  refreshSettingsUI();
}
function setFont(font){
  SETTINGS.font = font; persistSettings(); refreshSettingsUI();
}
function setFontSize(v){
  SETTINGS.fontSize = parseInt(v);
  document.getElementById('fontSizeLabel').textContent = toFa(v);
  persistSettings();
}
function setLineHeight(v){
  SETTINGS.lineHeight = parseInt(v);
  persistSettings();
}

/* ---------------- init ---------------- */
migrateIfNeeded();
applySettingsToRoot();
setTheme(SETTINGS.theme, true);
showScreen('bookshelf');
renderBookshelf();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
window.addEventListener('resize', ()=>{
  if(document.getElementById('reading').classList.contains('active')){
    paginateAll();
    if(currentPageIndex>=pages.length) currentPageIndex = Math.max(0,pages.length-1);
    renderCurrentPage();
  }
});
window.addEventListener('orientationchange', ()=>{
  // dimensions settle a bit after the rotation event fires, so wait briefly
  setTimeout(()=>{
    if(document.getElementById('reading').classList.contains('active')){
      paginateAll();
      if(currentPageIndex>=pages.length) currentPageIndex = Math.max(0,pages.length-1);
      renderCurrentPage();
    }
  }, 250);
});
</script>
</body>
</html>
